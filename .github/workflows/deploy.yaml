name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            image_name: frontend
            context: ./frontend
          - service: backend
            image_name: app
            context: ./backend
          - service: websockets
            image_name: websockets
            context: ./sockets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            lucasremigio/${{ matrix.image_name }}:${{ github.sha }}
            lucasremigio/${{ matrix.image_name }}:latest
          cache-from: type=registry,ref=lucasremigio/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=lucasremigio/${{ matrix.image_name }}:buildcache,mode=max
          build-args: |
            ${{ matrix.service == 'frontend' && format('BACKEND_URL={0}', vars.BACKEND_URL) || '' }}
            ${{ matrix.service == 'frontend' && format('SOCKETS_URL={0}', vars.SOCKETS_URL) || '' }}
            ${{ matrix.service == 'frontend' && format('BACKEND_PORT={0}', vars.BACKEND_PORT) || '' }}
            ${{ matrix.service == 'frontend' && format('SOCKETS_PORT={0}', vars.SOCKETS_PORT) || '' }}
            ${{ matrix.service == 'frontend' && format('PUBLIC_GOOGLE_CLIENT_ID={0}', secrets.GOOGLE_CLIENT_ID) || '' }}
            ${{ matrix.service == 'frontend' && format('PUBLIC_VAPID_KEY={0}', secrets.VAPID_PUBLIC_KEY) || '' }}
            ${{ matrix.service == 'frontend' && format('ENABLE_WEBSOCKETS={0}', vars.ENABLE_WEBSOCKETS || 'false') || '' }}
            ${{ matrix.service == 'frontend' && format('TELEGRAM_BOT_USERNAME={0}', vars.TELEGRAM_BOT_USERNAME || 'GraoCertoBot') || '' }}
            ${{ matrix.service == 'frontend' && 'IS_PRODUCTION=true' || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ~/wallet-tracker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose file to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}"
          scp -o StrictHostKeyChecking=no docker-compose.prod.yaml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.prod.yml

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ env.DEPLOY_PATH }}
            
            # On the server, only save the tag, in case we need to restart manually
            echo "TAG=${{ github.sha }}" > .env

            export TAG='${{ github.sha }}'

            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_USER='${{ secrets.DB_USER }}'
            export REMOTE_DB_URL='${{ secrets.REMOTE_DB_URL }}'

            # External API Keys
            export OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}'
            export GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}'
            export VAPID_PUBLIC_KEY='${{ secrets.VAPID_PUBLIC_KEY }}'
            export VAPID_PRIVATE_KEY='${{ secrets.VAPID_PRIVATE_KEY }}'
            # Empty disables the telegram bot; the rest of the app is unaffected
            export TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'

            # JWT vars
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export JWT_EXPIRATION_IN_SECONDS='${{ secrets.JWT_EXPIRATION_IN_SECONDS }}'

            # Use the repository variable
            export FRONTEND_URL='${{ vars.FRONTEND_URL }}'
            export FRONTEND_DOMAIN='${{ vars.FRONTEND_DOMAIN }}'
            export BACKEND_URL='${{ vars.BACKEND_URL }}'
            export BACKEND_PORT='${{ vars.BACKEND_PORT }}'
            export SOCKETS_URL='${{ vars.SOCKETS_URL }}'
            export SOCKETS_PORT='${{ vars.SOCKETS_PORT }}'

            # SMTP vars
            export SMTP_HOST='${{ secrets.SMTP_HOST }}'
            export SMTP_PORT='${{ secrets.SMTP_PORT }}'
            export SMTP_USERNAME='${{ secrets.SMTP_USERNAME }}'
            export SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}'
            export SMTP_FROM_EMAIL='${{ secrets.SMTP_FROM_EMAIL }}'
            export SMTP_FROM_NAME='${{ secrets.SMTP_FROM_NAME }}'

            # Setup COMPOSE_PROFILES based on ENABLE_WEBSOCKETS
            ENABLE_WEBSOCKETS="${{ vars.ENABLE_WEBSOCKETS }}"
            if [ "$ENABLE_WEBSOCKETS" = "true" ]; then
              export COMPOSE_PROFILES="websockets"
            else
              export COMPOSE_PROFILES=""
            fi

            # Pull images in parallel
            docker pull lucasremigio/frontend:${{ github.sha }} &
            docker pull lucasremigio/app:${{ github.sha }} &
            if [ "$ENABLE_WEBSOCKETS" = "true" ]; then
              docker pull lucasremigio/websockets:${{ github.sha }} &
            fi
            wait

            # Deploy with minimal downtime and remove orphans
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            
            # Clean up old images (keep last 3 versions)
            docker image prune -a -f
          EOF
