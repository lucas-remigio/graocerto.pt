name: wallet-tracker

services:
  frontend:
    image: lucasremigio/frontend:${TAG}
    container_name: graocerto-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.wallet.entrypoints=websecure"
      - "traefik.http.routers.wallet.tls.certresolver=myresolver"
      - "traefik.http.services.wallet.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      # these environments are used on the nginx conf file
      - NODE_ENV=production
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
      - BACKEND_URL=${BACKEND_URL}
      - SOCKETS_URL=${SOCKETS_URL}
      - BACKEND_PORT=${BACKEND_PORT}
      - SOCKETS_PORT=${SOCKETS_PORT}
      - PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

  websockets:
    image: lucasremigio/websockets:${TAG}
    container_name: graocerto-websockets
    profiles:
      - websockets
    networks:
      - proxy
      - default
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - PORT=${SOCKETS_PORT}
      - FRONTEND_URL=${FRONTEND_URL}

  app:
    image: lucasremigio/app:${TAG}
    container_name: graocerto-server
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - IS_PRODUCTION=true
      - PORT=${BACKEND_PORT}
      - REMOTE_DB_URL=${REMOTE_DB_URL}
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@mysql-container:3306/wallet_tracker
      - FRONTEND_URL=${FRONTEND_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_IN_SECONDS=${JWT_EXPIRATION_IN_SECONDS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
    networks:
      - proxy
      - default

volumes:
  mysql_data:

networks:
  proxy:
    external: true
