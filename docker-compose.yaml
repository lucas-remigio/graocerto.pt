services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        BACKEND_URL: ${SOCKETS_URL}
        SOCKETS_URL: ${BACKEND_URL}
        BACKEND_PORT: ${BACKEND_PORT}
        SOCKETS_PORT: ${SOCKETS_PORT}
        IS_PRODUCTION: false
        PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      - app
    environment:
      - NODE_ENV=development
      - PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - IS_PRODUCTION=false
      - PORT=${BACKEND_PORT}
        # Single connection string for local database
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/wallet_tracker
      # This is to test the remote database in dev. Change IS_PRODUCTION to true to use the remote database
      - REMOTE_DB_URL=${SESSION_POOLER}
      - FRONTEND_URL=${FRONTEND_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_IN_SECONDS=${JWT_EXPIRATION_IN_SECONDS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}

  websockets:
    profiles:
      - websockets
    build:
      context: ./sockets
      dockerfile: Dockerfile
    ports:
      - "${SOCKETS_PORT}:${SOCKETS_PORT}"
    environment:
      - PORT=${SOCKETS_PORT}
      - FRONTEND_URL=${FRONTEND_URL}

  db:
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wallet_tracker
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 0.5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-container
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana-container
    ports:
      - "3004:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  prometheus_data:
  grafana_data:
