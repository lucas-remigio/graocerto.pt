services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        BACKEND_URL: ${SOCKETS_URL}
        SOCKETS_URL: ${BACKEND_URL}
        BACKEND_PORT: ${BACKEND_PORT}
        SOCKETS_PORT: ${SOCKETS_PORT}
        IS_PRODUCTION: false
        PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        PUBLIC_VAPID_KEY: ${VAPID_PUBLIC_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - app
    environment:
      - NODE_ENV=development
      - PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

  app:
    container_name: graocerto-server
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - IS_PRODUCTION=false
      - PORT=${BACKEND_PORT}
        # Single connection string for local database
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/wallet_tracker
      # This is to test the remote database in dev. Change IS_PRODUCTION to true to use the remote database
      - REMOTE_DB_URL=${SESSION_POOLER}
      - FRONTEND_URL=${FRONTEND_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_IN_SECONDS=${JWT_EXPIRATION_IN_SECONDS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - OTEL_COLLECTOR_ENDPOINT=vps-otel-collector:4317
    networks:
      - default
      - proxy

  websockets:
    profiles:
      - websockets
    build:
      context: ./sockets
      dockerfile: Dockerfile
    ports:
      - "${SOCKETS_PORT}:${SOCKETS_PORT}"
    environment:
      - PORT=${SOCKETS_PORT}
      - FRONTEND_URL=${FRONTEND_URL}

  db:
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wallet_tracker
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 0.5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  mysql_data:

networks:
  proxy:
    external: true
